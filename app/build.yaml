targets:
  $default:
    builders:
      drift_dev:
        options:
          # Used by `dart run drift_dev make-migrations`.
          databases:
            app_database: lib/src/core/database/app_database.dart
          schema_dir: drift_schemas/
          test_dir: test/drift/
          # ISO-8601 text keeps timestamps readable and sortable (always UTC).
          store_date_time_values_as_text: true
          sql:
            dialect: sqlite
            options:
              version: "3.45"
      json_serializable:
        options:
          explicit_to_json: true
